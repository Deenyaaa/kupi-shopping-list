<!doctype html>
<html lang="ru" data-title="list.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Купи</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/i18n.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="list.title">Купи</h1>
    <div class="actions">
      <span class="muted" id="me"></span>
      <a class="link" id="admin-link" href="/admin" data-i18n="nav.admin" hidden>Админка</a>
      <button class="link" id="pw-toggle" type="button" data-i18n="nav.password">Пароль</button>
      <button class="link" id="lang" type="button">EN</button>
      <button class="link" id="logout" type="button" data-i18n="nav.logout">Выйти</button>
    </div>
  </header>
  <form class="card stack" id="pw" hidden>
    <strong data-i18n="pw.title">Сменить пароль</strong>
    <input type="password" name="current" placeholder="Текущий пароль" data-i18n-ph="pw.current" autocomplete="current-password" required>
    <input type="password" name="new" placeholder="Новый пароль, от 8 символов" data-i18n-ph="pw.new" autocomplete="new-password" minlength="8" required>
    <input type="password" name="repeat" placeholder="Новый пароль ещё раз" data-i18n-ph="pw.repeat" autocomplete="new-password" minlength="8" required>
    <div class="row">
      <button class="btn" type="submit" data-i18n="pw.save">Сохранить</button>
      <button class="link" type="button" id="pw-cancel" data-i18n="pw.cancel">Отмена</button>
    </div>
    <p class="muted" id="pw-msg" role="status"></p>
  </form>
  <form class="add" id="add">
    <input type="text" name="product" placeholder="Что купить?" data-i18n-ph="list.placeholder" maxlength="200" autocomplete="off" required>
    <button class="btn" type="submit" data-i18n="list.add">Добавить</button>
  </form>
  <p class="error" id="error" role="alert"></p>
  <ul id="todo"></ul>
  <p class="empty" id="empty" data-i18n="list.empty" hidden>Список пуст</p>
  <div class="section" id="bought-head" hidden>
    <span class="muted" data-i18n="list.bought">Куплено</span>
    <button class="link" id="clear" data-i18n="list.clear">Очистить купленное</button>
  </div>
  <ul id="bought"></ul>
</main>
</body>
</html>
