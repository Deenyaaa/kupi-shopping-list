<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Покупки</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/login.js" defer></script>
</head>
<body>
<main class="login">
  <h1>Список покупок</h1>
  <p class="muted">Войди, чтобы открыть список.</p>
  <form id="login">
    <input type="text" name="username" placeholder="Логин" autocomplete="username" autocapitalize="off" required>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="btn" type="submit">Войти</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</main>
</body>
</html>
